<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 640" role="img" aria-label="Illustration of a modern university building with students">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#BFDBFE"/><stop offset="1" stop-color="#EFF6FF"/></linearGradient>
    <linearGradient id="bld" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1E3A8A"/><stop offset="1" stop-color="#142B4A"/></linearGradient>
  </defs>
  <rect width="800" height="640" fill="url(#sky)"/>
  <circle cx="660" cy="120" r="48" fill="#FDE68A" opacity=".9"/>
  <g fill="#fff" opacity=".9"><ellipse cx="160" cy="110" rx="70" ry="20"/><ellipse cx="205" cy="98" rx="46" ry="18"/><ellipse cx="520" cy="170" rx="60" ry="16"/></g>
  <!-- clock tower -->
  <rect x="360" y="110" width="80" height="250" fill="url(#bld)"/>
  <polygon points="350,112 400,50 450,112" fill="#2563EB"/>
  <circle cx="400" cy="160" r="22" fill="#fff"/><path d="M400 160V146M400 160l10 6" stroke="#142B4A" stroke-width="3" stroke-linecap="round" fill="none"/>
  <!-- main building -->
  <rect x="140" y="280" width="520" height="160" fill="url(#bld)"/>
  <polygon points="120,282 400,230 680,282" fill="#2563EB"/>
  <g fill="#fff"><rect x="190" y="310" width="34" height="46" rx="3"/><rect x="250" y="310" width="34" height="46" rx="3"/><rect x="316" y="310" width="34" height="46" rx="3"/>
  <rect x="450" y="310" width="34" height="46" rx="3"/><rect x="516" y="310" width="34" height="46" rx="3"/><rect x="576" y="310" width="34" height="46" rx="3"/></g>
  <g fill="#BFDBFE" opacity=".95"><rect x="190" y="380" width="34" height="40" rx="3"/><rect x="250" y="380" width="34" height="40" rx="3"/><rect x="516" y="380" width="34" height="40" rx="3"/><rect x="576" y="380" width="34" height="40" rx="3"/></g>
  <!-- entrance columns -->
  <rect x="352" y="330" width="96" height="110" fill="#F8FAFC"/>
  <g fill="#E2E8F0"><rect x="360" y="330" width="10" height="110"/><rect x="385" y="330" width="10" height="110"/><rect x="405" y="330" width="10" height="110"/><rect x="430" y="330" width="10" height="110"/></g>
  <rect x="340" y="320" width="120" height="14" fill="#fff"/>
  <!-- steps and ground -->
  <rect x="320" y="440" width="160" height="10" fill="#CBD5E1"/><rect x="300" y="450" width="200" height="10" fill="#E2E8F0"/>
  <rect y="460" width="800" height="180" fill="#86EFAC"/><rect y="460" width="800" height="10" fill="#4ADE80"/>
  <path d="M340 640 390 460h20l50 180z" fill="#E2E8F0"/>
  <!-- trees -->
  <g><rect x="76" y="420" width="12" height="60" fill="#78350F"/><circle cx="82" cy="400" r="46" fill="#16A34A"/><circle cx="108" cy="420" r="30" fill="#22C55E"/>
  <rect x="712" y="420" width="12" height="60" fill="#78350F"/><circle cx="718" cy="400" r="46" fill="#16A34A"/><circle cx="692" cy="425" r="30" fill="#22C55E"/></g>
  <!-- students -->
  <g>
    <circle cx="230" cy="520" r="14" fill="#F59E0B"/><rect x="214" y="535" width="32" height="56" rx="14" fill="#2563EB"/>
    <circle cx="290" cy="540" r="14" fill="#92400E"/><rect x="274" y="555" width="32" height="56" rx="14" fill="#F97316"/>
    <circle cx="520" cy="525" r="14" fill="#FBBF24"/><rect x="504" y="540" width="32" height="56" rx="14" fill="#142B4A"/>
    <circle cx="580" cy="545" r="14" fill="#B45309"/><rect x="564" y="560" width="32" height="56" rx="14" fill="#DB2777"/>
  </g>
</svg>
